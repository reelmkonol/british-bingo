<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>England Bingo</title>
<meta name="description" content="Spot-it bingo for a trip to England. One board each, everyone can see everyone.">
<meta name="theme-color" content="#08281E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,800;0,900&family=Overpass+Mono:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2308281E'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='6' width='7' height='7'/%3E%3Crect x='19' y='6' width='7' height='7'/%3E%3Crect x='12.5' y='12.5' width='7' height='7' fill='%23C8102E'/%3E%3Crect x='6' y='19' width='7' height='7'/%3E%3Crect x='19' y='19' width='7' height='7'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<!-- ============================ HOME ============================ -->
<section class="screen" id="screen-home">
  <div class="plate">
    <div class="plate__mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span class="is-free"></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="eyebrow">Spot it &middot; tick it &middot; shout it</p>
    <h1 class="display">England<br>Bingo</h1>
    <p class="lede">Everyone gets their own shuffled board from the same list. Tick off what you spot. Peek at how the others are doing.</p>
  </div>

  <div class="stack" id="home-resume" hidden>
    <button class="btn btn--primary" id="resume-btn"></button>
    <p class="note">Picks up exactly where you left off.</p>
  </div>

  <form class="stack" id="join-form" autocomplete="off">
    <label class="field">
      <span class="field__label">Join with a game code</span>
      <input class="input input--code" id="join-code" name="code" inputmode="latin" autocapitalize="characters" spellcheck="false" maxlength="7" placeholder="XXXXX" aria-describedby="join-error">
    </label>
    <button class="btn btn--primary" type="submit">Open board</button>
    <p class="error" id="join-error" role="alert"></p>
  </form>

  <div class="rule" role="presentation"><span>or</span></div>

  <button class="btn btn--ghost" id="go-create">Start a new game</button>
</section>

<!-- =========================== CREATE =========================== -->
<section class="screen" id="screen-create" hidden>
  <button class="backlink" id="create-back" type="button">Back</button>
  <h2 class="display display--sm">Start a new game</h2>

  <form class="stack" id="create-form" autocomplete="off">
    <label class="field">
      <span class="field__label">Game name</span>
      <input class="input" id="create-title" maxlength="60" placeholder="England Bingo">
    </label>

    <label class="field">
      <span class="field__label">Centre square</span>
      <input class="input" id="create-free" maxlength="160" placeholder="Free square">
      <span class="field__hint">The middle of everyone's board. Starts ticked, but you can untick it if you'd rather make it a real task.</span>
    </label>

    <label class="field">
      <span class="field__label">Things to spot</span>
      <textarea class="input input--area" id="create-pool" rows="14" spellcheck="false"></textarea>
      <span class="field__hint">One per line. <strong><span id="pool-count">0</span></strong> so far &mdash; you need at least 24. Everyone draws 24 at random from this list, so a longer list means less overlap.</span>
    </label>

    <button class="btn btn--primary" type="submit">Create game</button>
    <p class="error" id="create-error" role="alert"></p>
  </form>
</section>

<!-- ============================ GAME ============================ -->
<section class="screen screen--game" id="screen-game" hidden>
  <header class="bar" id="bar">
    <div class="bar__id">
      <h2 class="bar__title" id="game-title">England Bingo</h2>
      <button class="bar__code" id="copy-link" type="button" title="Copy the invite link">
        <span id="game-code">-----</span>
        <span class="bar__copy" id="copy-label">Copy link</span>
      </button>
    </div>
    <button class="bar__menu" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Game menu">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="4" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="10" cy="16" r="1.7"/></svg>
    </button>
    <p class="bar__shout" id="bar-shout" hidden>Bingo</p>
  </header>

  <nav class="roster" id="roster" aria-label="Players"></nav>

  <main class="play">
    <div class="viewing" id="viewing"></div>

    <div class="board-frame" id="board-frame">
      <div class="board" id="board" role="grid" aria-label="Bingo board"></div>
      <svg class="strikes" id="strikes" viewBox="0 0 100 100" aria-hidden="true"></svg>
    </div>

    <ol class="checklist" id="checklist" hidden></ol>

    <div class="tray">
      <div class="segmented" role="tablist" aria-label="Board layout">
        <button class="segmented__opt is-on" id="view-grid" role="tab" aria-selected="true" type="button">Grid</button>
        <button class="segmented__opt" id="view-list" role="tab" aria-selected="false" type="button">List</button>
      </div>
      <p class="sync" id="sync"></p>
    </div>
  </main>

  <!-- menu sheet -->
  <div class="sheet" id="menu-sheet" hidden>
    <div class="sheet__panel" role="menu" aria-label="Game menu">
      <button class="sheet__item" data-menu="copy" role="menuitem" type="button">Copy invite link</button>
      <button class="sheet__item" data-menu="free" role="menuitem" type="button">Edit centre square</button>
      <button class="sheet__item" data-menu="shuffle" role="menuitem" type="button">Shuffle my board</button>
      <button class="sheet__item" data-menu="switch" role="menuitem" type="button">Change player on this device</button>
      <button class="sheet__item sheet__item--quiet" data-menu="close" role="menuitem" type="button">Close</button>
    </div>
  </div>

  <!-- join / resume gate -->
  <div class="sheet sheet--gate" id="gate" hidden>
    <div class="sheet__panel">
      <h3 class="sheet__title" id="gate-title">Who's playing?</h3>
      <div class="gate__existing" id="gate-existing"></div>
      <form class="stack stack--tight" id="gate-form" autocomplete="off">
        <label class="field">
          <span class="field__label" id="gate-name-label">Join as a new player</span>
          <input class="input" id="gate-name" maxlength="24" placeholder="Your name">
        </label>
        <button class="btn btn--primary" type="submit">Deal me a board</button>
        <p class="error" id="gate-error" role="alert"></p>
      </form>
    </div>
  </div>
</section>

<p class="toast" id="toast" hidden></p>

<script src="app.js"></script>
</body>
</html>
